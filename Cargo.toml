[workspace]
resolver = "2"
members = [
    "crates/*",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Your Name <you@example.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/yourname/yourproject"

[workspace.dependencies]
anyhow = "1"
audio = { path = "crates/audio" }
clap = { version = "4", features = ["derive"] }
coreaudio-rs = "0.14.2"
coreaudio-sys = "0.2"
danubius = { path = "crates/danubius" }
gpui = { git = "https://github.com/zed-industries/zed" }
gpui-component = { git = "https://github.com/longbridge/gpui-component" }
gpui-component-macros = { git = "https://github.com/longbridge/gpui-component" }
gpui-platform = { git = "https://github.com/zed-industries/zed", package = "gpui_platform", features = ["font-kit"] }
libc = "0.2"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
zalmoxis = { path = "crates/zalmoxis" }

[profile.release]
lto = true